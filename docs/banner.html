<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=JetBrains+Mono:wght@500;700&display=swap');
*{margin:0;box-sizing:border-box}
.card{width:1200px;height:675px;position:relative;overflow:hidden;font-family:'JetBrains Mono',monospace;
  background:radial-gradient(820px 520px at 82% -10%,rgba(59,111,224,.32),transparent 60%),
    radial-gradient(720px 480px at 2% 114%,rgba(217,178,91,.24),transparent 62%),
    linear-gradient(158deg,#080a11,#06070b 55%,#04050a);}
.vig{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 0%,transparent 50%,rgba(0,0,0,.62))}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
/* central concept: a repo box -> arrow into a sandbox box -> shield */
.stage{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:0}
.node{width:220px;height:220px;border-radius:30px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.glass{background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);box-shadow:0 34px 60px -26px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}
.node .ic{font-size:66px;line-height:1}
.node .t{font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:#9aa3b5}
.sandbox{border:1px solid rgba(217,178,91,.4);box-shadow:0 40px 70px -24px rgba(217,178,91,.35),inset 0 1px 0 rgba(243,217,152,.15)}
.sandbox .t{color:#f3d998}
.sandbox::before{content:'';position:absolute;inset:0;border-radius:30px;padding:1.5px;background:linear-gradient(140deg,#f3d998,transparent 55%,#3b6fe0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.arrow{width:92px;display:flex;align-items:center;justify-content:center;color:#d9b25b;font-size:40px}
.shield .ic{filter:drop-shadow(0 6px 16px rgba(226,72,74,.5))}
/* top kicker + bottom tagline, minimal text */
.kick{position:absolute;top:54px;left:0;right:0;text-align:center;z-index:4;font-size:17px;letter-spacing:.5em;text-transform:uppercase;color:#d9b25b}
.title{position:absolute;top:92px;left:0;right:0;text-align:center;z-index:4;font-family:'Playfair Display',serif;font-size:56px;color:#eef1f7;font-weight:700;letter-spacing:-.5px}
.title .g{font-style:italic;background:linear-gradient(100deg,#f3d998,#d9b25b 48%,#b98f3e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{position:absolute;bottom:52px;left:0;right:0;text-align:center;z-index:4;font-size:18px;color:#9aa3b5}
.tag b{color:#f3d998}
</style></head>
<body>
<div class="card">
  <div class="vig"></div><div class="grain"></div>
  <div class="kick">◈ Give your agent a tool ◈</div>
  <div class="title">Stop scanning. <span class="g">Run it.</span></div>
  <div class="stage" style="margin-top:46px">
    <div class="node glass"><div class="ic">📦</div><div class="t">The repo</div></div>
    <div class="arrow">⟶</div>
    <div class="node sandbox"><div class="ic">🧪</div><div class="t">AWS sandbox</div></div>
    <div class="arrow">⟶</div>
    <div class="node glass shield"><div class="ic">🛡️</div><div class="t">Verdict</div></div>
  </div>
  <div class="tag">A disposable AWS sandbox that <b>actually runs the repo</b></div>
</div>
</body></html>
