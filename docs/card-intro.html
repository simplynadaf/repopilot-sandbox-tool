<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap');
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#06070b;font-family:'Inter',sans-serif}
.stage{width:1920px;height:1080px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(1400px 900px at 82% -8%,rgba(59,111,224,.3),transparent 60%),
    radial-gradient(1200px 820px at 4% 112%,rgba(217,178,91,.24),transparent 62%),
    linear-gradient(160deg,#080a11,#06070b 55%,#04050a);}
.vig{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 0%,transparent 52%,rgba(0,0,0,.6))}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.kick{font-family:'JetBrains Mono',monospace;font-size:26px;letter-spacing:.5em;text-transform:uppercase;color:#d9b25b;z-index:3;opacity:0}
h1{font-family:'Playfair Display',serif;font-weight:700;font-size:118px;line-height:1.0;color:#eef1f7;text-align:center;z-index:3;margin-top:18px;letter-spacing:-1px}
h1 .g{font-style:italic;background:linear-gradient(100deg,#f3d998,#d9b25b 48%,#b98f3e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:34px;color:#9aa3b5;text-align:center;z-index:3;margin-top:30px;max-width:1200px;opacity:0}
.sub b{color:#f3d998;font-weight:600}
.badges{display:flex;gap:16px;margin-top:40px;z-index:3;opacity:0}
.b{font-family:'JetBrains Mono',monospace;font-size:20px;color:#f3d998;border:1px solid rgba(217,178,91,.34);background:rgba(217,178,91,.08);padding:9px 20px;border-radius:999px}
</style></head>
<body>
<div class="stage">
  <div class="vig"></div><div class="grain"></div>
  <div class="kick" id="kick">◈ Give your agent a tool ◈</div>
  <h1 id="h1">I gave my agent<br/><span class="g">one new tool</span></h1>
  <div class="sub" id="sub">a disposable AWS sandbox that <b>actually runs the repo</b></div>
  <div class="badges" id="badges"><span class="b">AWS CodeBuild</span><span class="b">Amazon Bedrock</span><span class="b">Strands</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
const tl = gsap.timeline();
tl.from('#h1',{y:50,opacity:0,duration:1.0,ease:'power3.out'})
  .to('#kick',{opacity:1,duration:.7,ease:'power2.out'},'-=0.6')
  .to('#sub',{opacity:1,y:0,duration:.7,ease:'power2.out'},'-=0.3')
  .fromTo('#sub',{y:16},{y:0,duration:.7,ease:'power2.out'},'<')
  .to('#badges',{opacity:1,y:0,duration:.6,ease:'power2.out'},'-=0.2')
  .fromTo('#badges',{y:14},{y:0,duration:.6},'<');
</script>
</body></html>
