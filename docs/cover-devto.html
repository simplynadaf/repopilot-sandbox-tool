<!DOCTYPE html><html><head><meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap');
*{margin:0;box-sizing:border-box}
html,body{width:1000px;height:420px;overflow:hidden;background:#06070b;font-family:'Inter',sans-serif}
.stage{width:1000px;height:420px;position:relative;display:flex;flex-direction:column;justify-content:center;padding:0 56px;
  background:radial-gradient(900px 560px at 86% -20%,rgba(59,111,224,.32),transparent 60%),
    radial-gradient(760px 520px at -6% 120%,rgba(217,178,91,.26),transparent 62%),
    linear-gradient(150deg,#080a11,#06070b 55%,#04050a);}
.vig{position:absolute;inset:0;background:radial-gradient(130% 110% at 50% 0%,transparent 50%,rgba(0,0,0,.6))}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.kick{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.34em;text-transform:uppercase;color:#d9b25b;z-index:3;margin-bottom:14px}
h1{font-family:'Playfair Display',serif;font-weight:700;font-size:52px;line-height:1.02;color:#eef1f7;z-index:3;letter-spacing:-.5px;max-width:860px}
h1 .g{font-style:italic;background:linear-gradient(100deg,#f3d998,#d9b25b 48%,#b98f3e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-family:'JetBrains Mono',monospace;font-size:17px;color:#9aa3b5;z-index:3;margin-top:18px}
.sub b{color:#f3d998;font-weight:700}
.chips{display:flex;gap:10px;margin-top:22px;z-index:3}
.c{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#f3d998;border:1px solid rgba(217,178,91,.34);background:rgba(217,178,91,.08);padding:6px 14px;border-radius:999px}
.badge{position:absolute;top:30px;right:48px;z-index:3;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8fb0f0;border:1px solid rgba(59,111,224,.4);background:rgba(59,111,224,.1);padding:7px 14px;border-radius:999px}
</style></head>
<body>
<div class="stage">
  <div class="vig"></div><div class="grain"></div>
  <div class="badge">AWS Builder Center Challenge</div>
  <div class="kick">◈ Give your agent a tool ◈</div>
  <h1>Stop scanning the repo.<br/><span class="g">Run it, in a box.</span></h1>
  <div class="sub">one new tool: a disposable <b>AWS CodeBuild</b> sandbox that catches the <b>curl | bash</b> a scan misses</div>
  <div class="chips"><span class="c">AWS CodeBuild</span><span class="c">Amazon Bedrock</span><span class="c">Strands</span></div>
</div>
</body></html>
